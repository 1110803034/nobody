        function enableBackgroundInteraction(backgroundPhoto) {
            const resizeHandle = backgroundPhoto.querySelector('.resize-handle');
            let interaction;

            function prepareInteraction(event) {
                const rect = backgroundPhoto.getBoundingClientRect();
                backgroundPhoto.style.left = `${rect.left}px`;
                backgroundPhoto.style.top = `${rect.top}px`;
                backgroundPhoto.style.right = 'auto';
                backgroundPhoto.style.transform = 'none';
                backgroundPhoto.style.width = `${rect.width}px`;
                backgroundPhoto.style.height = `${rect.height}px`;
                backgroundPhoto.setPointerCapture(event.pointerId);
            }

            backgroundPhoto.addEventListener('pointerdown', (event) => {
                if (event.button !== 0) {
                    return;
                }

                const rect = backgroundPhoto.getBoundingClientRect();
                const isResize = event.target === resizeHandle
                    || (event.clientX >= rect.right - 40 && event.clientY >= rect.bottom - 40);

                if (isResize) {
                    event.preventDefault();
                    prepareInteraction(event);
                    interaction = {
                        type: 'resize',
                        startX: event.clientX,
                        startY: event.clientY,
                        startWidth: backgroundPhoto.offsetWidth,
                        startHeight: backgroundPhoto.offsetHeight
                    };
                    return;
                }

                event.preventDefault();
                prepareInteraction(event);
                interaction = {
                    type: 'move',
                    startX: event.clientX,
                    startY: event.clientY,
                    startLeft: backgroundPhoto.offsetLeft,
                    startTop: backgroundPhoto.offsetTop
                };
            });

            resizeHandle.addEventListener('pointerdown', (event) => {
                event.preventDefault();
                event.stopPropagation();
                prepareInteraction(event);
                interaction = {
                    type: 'resize',
                    startX: event.clientX,
                    startY: event.clientY,
                    startWidth: backgroundPhoto.offsetWidth,
                    startHeight: backgroundPhoto.offsetHeight
                };
            });

            backgroundPhoto.addEventListener('pointermove', (event) => {
                if (!interaction) {
                    return;
                }

                if (interaction.type === 'move') {
                    backgroundPhoto.style.left = `${interaction.startLeft + event.clientX - interaction.startX}px`;
                    backgroundPhoto.style.top = `${interaction.startTop + event.clientY - interaction.startY}px`;
                } else {
                    backgroundPhoto.style.width = `${Math.max(120, interaction.startWidth + event.clientX - interaction.startX)}px`;
                    backgroundPhoto.style.height = `${Math.max(160, interaction.startHeight + event.clientY - interaction.startY)}px`;
                }
            });

            backgroundPhoto.addEventListener('pointerup', (event) => {
                interaction = null;
                backgroundPhoto.releasePointerCapture(event.pointerId);
            });
            backgroundPhoto.addEventListener('pointercancel', () => {
                interaction = null;
            });
        }

        function renderAlbums() {
            albumGrid.innerHTML = albums.map((album, index) => {
                const cover = album.images[Math.floor(Math.random() * album.images.length)];
                return `
                    <button class="album-card" type="button" data-album-index="${index}">
                        <img src="${cover[0]}" alt="${album.title}相簿封面">
                        <span class="album-card-content">
                            <strong>${album.title}</strong>
                            <small>${album.description}</small>
                            <span class="album-count">${album.images.length} 張照片</span>
                        </span>
                    </button>
                `;
            }).join('');

            albumGrid.querySelectorAll('.album-card').forEach((card) => {
                card.addEventListener('click', () => openAlbum(Number(card.dataset.albumIndex)));
            });
        }

        function openAlbum(index) {
            const album = albums[index];
            pageTitle.textContent = album.title;
            pageDescription.textContent = album.description;
            backToAlbums.hidden = false;
            leftBackgroundPhoto.hidden = true;
            rightBackgroundPhoto.hidden = true;
            albumGrid.hidden = true;
            gallery.hidden = false;
            gallery.innerHTML = album.images.map(([src, alt]) => `
                <div class="photo"><img src="${src}" alt="${alt}"></div>
            `).join('');
            galleryImages = Array.from(gallery.querySelectorAll('img'));
            galleryImages.forEach((image) => {
                image.addEventListener('click', () => openViewer(image));
            });
            history.pushState({ albumIndex: index }, '', `#album-${index}`);
        }

        function showAlbums() {
            closeFullscreenViewer();
            pageTitle.textContent = '我的相簿';
            pageDescription.textContent = '選擇一個相簿，開始瀏覽照片';
            backToAlbums.hidden = true;
            leftBackgroundPhoto.hidden = false;
            rightBackgroundPhoto.hidden = false;
            albumGrid.hidden = false;
            gallery.hidden = true;
            history.pushState({}, '', window.location.pathname);
            renderAlbums();
        }

        function showImage(index) {
            currentImageIndex = (index + galleryImages.length) % galleryImages.length;
            const image = galleryImages[currentImageIndex];
            fullscreenImage.src = image.src;
            fullscreenImage.alt = image.alt;
        }

        function openViewer(image) {
            showImage(galleryImages.indexOf(image));
            viewer.hidden = false;
            document.body.classList.add('viewer-open');
            window.clearInterval(autoSwitchTimer);
            autoSwitchTimer = window.setInterval(showNextImage, 5000);

            if (viewer.requestFullscreen) {
                viewer.requestFullscreen().catch(() => {});
            }
        }

        function closeFullscreenViewer() {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            }

            window.clearInterval(autoSwitchTimer);
            viewer.hidden = true;
            fullscreenImage.src = '';
            document.body.classList.remove('viewer-open');
        }

        function showPreviousImage() {
            showImage(currentImageIndex - 1);
        }

        function showNextImage() {
            showImage(currentImageIndex + 1);
        }

        galleryImages.forEach((image) => {
            image.addEventListener('click', () => openViewer(image));
        });

        closeViewer.addEventListener('click', closeFullscreenViewer);
        previousImage.addEventListener('click', showPreviousImage);
        nextImage.addEventListener('click', showNextImage);
        viewer.addEventListener('click', (event) => {
            if (event.target === viewer) {
                closeFullscreenViewer();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !viewer.hidden) {
                closeFullscreenViewer();
            }

            if (event.key === 'ArrowLeft' && !viewer.hidden) {

            }

        window.addEventListener('popstate', () => {
            const albumIndex = Number(window.location.hash.replace('#album-', ''));
            if (Number.isInteger(albumIndex) && albums[albumIndex]) {
                openAlbum(albumIndex);
            } else {
                showAlbums();
            }
        });

        renderAlbums();
        enableBackgroundInteraction(leftBackgroundPhoto);
        enableBackgroundInteraction(rightBackgroundPhoto);
    </script>

</body>
</html>
